<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#241b38">
    <title>CineMel | Gestão do cinema</title>
    <link rel="stylesheet" href="/cinemel-app.css">
    <script defer src="/cinemel-app.js"></script>
</head>
<body>
    <header class="masthead">
        <div class="frame masthead-inner">
            <a href="/" class="wordmark" aria-label="Voltar à programação do CineMel">CineMel</a>
            <span>Gestão do cinema</span>
        </div>
    </header>
    <main class="frame">
        <section class="section-header" aria-labelledby="heading">
            <div>
                <h1 id="heading">Assentos</h1>
                <p id="intro">Consulte e organize os lugares de cada sala.</p>
            </div>
            <button type="button" id="new-record" class="primary">Cadastrar assento</button>
        </section>
        <div id="notice" class="notice" role="status" hidden></div>
        <section class="records" aria-labelledby="list-heading">
            <header class="list-header">
                <h2 id="list-heading">Cadastros</h2>
                <span id="count"></span>
            </header>
            <p id="list-status" class="list-status" role="status"></p>
            <button id="retry" type="button" hidden>Tentar novamente</button>
            <ul id="entries"></ul>
        </section>
    </main>

    <nav class="navigation" aria-label="Áreas do CineMel">
        <div class="frame navigation-inner">
            <a href="#filmes">Filmes</a>
            <a href="#salas">Salas</a>
            <a href="#assentos">Assentos</a>
            <a href="#sessoes">Sessões</a>
        </div>
    </nav>

    <dialog id="editor" aria-labelledby="editor-title">
        <form id="record-form">
            <header class="dialog-header">
                <h2 id="editor-title"></h2>
                <button type="button" id="close-editor" aria-label="Fechar formulário">×</button>
            </header>
            <div id="fields"></div>
            <p id="form-error" class="error" role="alert" tabindex="-1" hidden></p>
            <div class="actions">
                <button type="button" id="cancel-editor">Cancelar</button>
                <button type="submit" id="review-save" class="primary">Revisar e salvar</button>
            </div>
        </form>
    </dialog>

    <dialog id="confirmation" aria-labelledby="confirmation-title" aria-describedby="confirmation-text">
        <div class="dialog-header">
            <h2 id="confirmation-title"></h2>
        </div>
        <p id="confirmation-text"></p>
        <p id="confirmation-error" class="error" role="alert" hidden></p>
        <div class="actions">
            <button type="button" id="cancel-confirmation" autofocus>Voltar</button>
            <button type="button" id="confirm-action" class="primary">Confirmar</button>
        </div>
    </dialog>
</body>
</html>
