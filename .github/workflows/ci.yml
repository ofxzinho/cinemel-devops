name: Cinemel

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testar e construir imagem
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'cinemel' }}
      PUSH_ENABLED: ${{ vars.DOCKERHUB_PUSH_ENABLED || 'false' }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executar testes
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Construir imagem Docker
        run: docker build --file dockerfile --tag "cinemel:${GITHUB_SHA}" .

      - name: Enviar imagem ao Docker Hub
        if: ${{ env.PUSH_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Configure o secret DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Configure o secret DOCKERHUB_TOKEN}"
          IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${GITHUB_SHA}"
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "cinemel:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
