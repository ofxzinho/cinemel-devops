name: Cinemel
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Starting build
    runs-on: ubuntu-latest
    environment: secrets
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'cinemel' }}
      PUSH_ENABLED: ${{ vars.DOCKERHUB_PUSH_ENABLED || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Altere para a versão do seu projeto se não for o Java 17
          cache: 'maven'

      - name: Testes (obrigatórios antes do build)
        run: 
          ./mvnw test

      - name: Build da imagem
        run: docker build --tag "cinemel:${GITHUB_SHA}" .
      - name: Push no Docker Hub
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Configure DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Configure DOCKERHUB_TOKEN}"
          IMAGE="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${GITHUB_SHA}"
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker tag "cinemel:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"